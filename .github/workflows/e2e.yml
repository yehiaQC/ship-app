name: E2E tests (Playwright)
on:
  push:
    branches: [main, ship-app-home-branch]
  pull_request:
  workflow_dispatch:
jobs:
  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:3000
      E2E_USER_EMAIL: ksa@qacart.com
      # Seeded test user's password (see README "Logging in"); add it as a repository secret.
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and seed the app
        # npm install, not npm ci: the app's package-lock.json is out of sync with package.json
        run: |
          npm install --no-audit --no-fund
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
          npm run setup
      - name: Install test dependencies
        working-directory: automation
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # The app is started by the webServer block in automation/playwright.config.ts
      - name: Run tests
        working-directory: automation
        run: npx playwright test
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation/playwright-report/
          retention-days: 14
